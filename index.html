<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakery Royale</title>
<meta name="theme-color" content="#080504">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bakery Royale">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8b83f;--gold2:#b8892e;--goldhi:#fff0b3;--ink:#f3e3b0;--mute:#c9b27a;--line:rgba(184,137,46,.45);--red:#b3121c;--ok:#7be08b;--err:#ff8a8a;--serif:"Playfair Display",Georgia,"Times New Roman",serif;--disp:"Cinzel","Playfair Display",Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:#070403;scroll-behavior:smooth;scroll-padding-top:10px;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:16px/1.4 var(--serif);min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
background:radial-gradient(ellipse 90% 40% at 50% 0%,rgba(150,30,25,.35),transparent 70%),radial-gradient(ellipse at 50% 100%,rgba(120,80,10,.25),transparent 60%),#080504;background-attachment:fixed}
/* Vorhänge links/rechts */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:min(11vw,64px);z-index:0;pointer-events:none;
background:repeating-linear-gradient(90deg,#3a0408 0 5px,#8e101a 9px,#c21a24 12px,#8e101a 15px,#3a0408 20px);opacity:.85}
body::before{left:0;-webkit-mask-image:linear-gradient(90deg,#000 20%,transparent);mask-image:linear-gradient(90deg,#000 20%,transparent)}
body::after{right:0;-webkit-mask-image:linear-gradient(270deg,#000 20%,transparent);mask-image:linear-gradient(270deg,#000 20%,transparent)}
main{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 12px 48px}
.gold{background:linear-gradient(180deg,var(--goldhi) 0%,#f0c24d 45%,#b27a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
svg.crown{display:block;fill:currentColor}

/* Header / Marquee */
header{margin-bottom:14px}
.marquee{position:relative;margin:18px 4px 0;border-radius:26px;border:7px dotted #ffdd8a;background:linear-gradient(180deg,#220809,#0b0405);
box-shadow:0 0 22px rgba(255,190,60,.55),0 0 0 2px #7b1119,inset 0 0 22px rgba(255,170,40,.25);padding:20px 8px 10px;text-align:center}
.marquee .crown-top{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:54px;color:#f2c14c;filter:drop-shadow(0 0 6px rgba(255,200,80,.8))}
h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(24px,8.2vw,56px);white-space:nowrap;line-height:1;letter-spacing:.5px;text-transform:uppercase;filter:drop-shadow(0 2px 0 #5b3a05) drop-shadow(0 0 8px rgba(255,180,50,.45))}
.tag{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-family:var(--disp);font-size:clamp(9px,2.6vw,13px);letter-spacing:1.3px;text-transform:uppercase;color:#f0d9a0}
.tag::before,.tag::after{content:"";height:1px;width:clamp(14px,6vw,40px);background:var(--gold2)}
.sides{display:flex;justify-content:space-between;gap:12px;margin:12px 6px 0;font-family:var(--disp);font-size:clamp(10px,2.8vw,13px);letter-spacing:1px;text-transform:uppercase;line-height:1.35;color:var(--gold)}
.sides div{display:flex;flex-direction:column;gap:4px;max-width:44%}
.sides div:last-child{text-align:right;align-items:flex-end}
.sides .crown{width:18px;color:var(--gold)}
.sub{margin:12px 6px 0;text-align:center;color:var(--mute);font-size:14px}

/* Kategorie-Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:6px -2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;text-decoration:none;color:#efe0b0;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;
background:linear-gradient(180deg,#1d1612,#0b0807);border:1.5px solid #5d4a22;box-shadow:inset 0 0 8px rgba(0,0,0,.8)}
.chip i{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
background:repeating-conic-gradient(#efe4c4 0 14deg,#1b1b1b 14deg 30deg);box-shadow:0 1px 4px rgba(0,0,0,.7)}
.chip i::before{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3a,#111);border:1.5px solid #cfc3a0}
.chip i svg{position:relative;width:14px;color:#e9dcb4}
.chip.on{border-color:#d33a3a;background:linear-gradient(180deg,#34090c,#150506);box-shadow:0 0 10px rgba(200,30,40,.45),inset 0 0 8px rgba(0,0,0,.6)}
.chip.on i::before{background:radial-gradient(circle at 35% 30%,#e0343c,#8d0c14)}

/* Karten */
.card{background:linear-gradient(180deg,#17100c,#0a0706);color:var(--ink);border:2px solid var(--gold2);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:inset 0 0 0 3px #0a0706,inset 0 0 0 4px var(--line),0 8px 22px rgba(0,0,0,.6)}
.name-label{display:block;font-family:var(--disp);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);margin-bottom:6px}
textarea{font:inherit;font-weight:600;font-size:16px;background:#0a0706;color:var(--goldhi);border:1.5px solid var(--gold2);border-radius:12px;width:100%;padding:10px 12px;resize:vertical;min-height:62px}
textarea::placeholder{color:#7d6b43}
textarea:focus{border-color:var(--gold);box-shadow:0 0 10px rgba(232,184,63,.35);outline:none}
input[type=text]{font:inherit;font-weight:700;font-size:18px;background:#0a0706;color:var(--goldhi);border:1.5px solid var(--gold2);border-radius:12px;width:100%;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input[type=text]::placeholder{color:#7d6b43}
input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 10px rgba(232,184,63,.35);outline:none}

.cat{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin:22px 0 12px;color:var(--gold)}
.cat::before,.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
.cat::after{background:linear-gradient(270deg,transparent,var(--gold2))}
.cat svg{width:18px;color:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px;border-radius:14px;background:linear-gradient(180deg,rgba(30,20,12,.6),rgba(10,7,5,.6));border:1px solid var(--line)}
.item{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 6px 8px;border-radius:10px;
background:linear-gradient(180deg,#14100d,#070504);border:2px solid var(--gold2);box-shadow:inset 0 0 0 2px #070504,inset 0 0 0 3px var(--line)}
.media{width:100%;padding:6px 6px 0}
.thumb,.thumb-badge{display:block;width:100%;aspect-ratio:1/1;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold2),0 0 0 6px #5a0b11,0 6px 12px rgba(0,0,0,.7)}
.thumb{object-fit:contain;padding:7%}
.thumb-badge{display:flex;align-items:center;justify-content:center;font-size:40px;background:radial-gradient(circle,#2a1d12,#0d0907)}
.fav{position:absolute;top:5px;right:5px;z-index:2;width:28px;height:28px;padding:0;border:0;background:transparent;color:var(--gold);cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.fav svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.8;fill:none}
.fav.on{color:#e0343c}.fav.on svg{fill:currentColor}
.nm{margin-top:10px;font-weight:600;font-size:13px;line-height:1.2;color:var(--ink);hyphens:auto;overflow-wrap:anywhere}
.pr{margin-top:3px;font-weight:700;font-size:15px;color:var(--gold)}
.pr small{display:block;font-size:10px;font-weight:500;color:var(--mute);margin-top:1px}
.qty{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:auto;border:1.5px solid var(--gold2);border-radius:999px;padding:3px;background:#0a0706}
.item .nm+.pr+.qty{margin-top:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle at 35% 30%,#2a1f10,#0c0907);color:var(--gold);font:700 18px/1 var(--serif);cursor:pointer;padding:0;display:grid;place-items:center;transition:transform .1s;-webkit-tap-highlight-color:transparent}
.qty button:active{transform:scale(.9)}
.qty b{min-width:18px;text-align:center;font-size:16px;color:#fff}

/* Jackpot */
.item.jackpot{padding-top:22px;border:3px dotted #ffb83a;background:radial-gradient(ellipse at 50% 30%,#5a0d12,#14070a 70%);box-shadow:0 0 16px rgba(255,170,40,.75),inset 0 0 14px rgba(255,170,40,.3)}
.jp{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:3;width:88%;text-align:center}
.jp svg{width:22px;margin:0 auto -4px;color:#f2c14c;filter:drop-shadow(0 0 4px rgba(255,200,80,.8))}
.jp span{display:block;padding:2px 0;border:1.5px solid #e0b04a;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,#8c1018,#3a0509);font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:1.5px;color:#ffd978;text-shadow:0 1px 0 #000}
.item.jackpot .media{padding-top:10px}

/* Summe / Buttons */
.sum{display:flex;justify-content:space-between;color:var(--mute);padding:2px 0;font-size:15px}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:21px;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);color:var(--gold)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;padding:14px;border-radius:12px;border:1.5px solid #ffe08a;background:linear-gradient(180deg,#ffd75e,#e0a21f 55%,#b87810);color:#2a1500;font:700 16px var(--serif);cursor:pointer;margin-top:12px;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.99)}
.btn.alt{background:transparent;color:var(--gold);border:1.5px solid var(--gold2);margin-top:8px;box-shadow:none}
#reset{margin-top:14px}
.btn.alt:hover{background:rgba(232,184,63,.1)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.name{flex:1;font-weight:600;line-height:1.25;color:var(--ink)}
.name small{display:block;color:var(--mute);font-weight:400;margin-top:2px;font-size:13px;overflow-wrap:anywhere}
.msg{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--mute);min-height:20px}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--err)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (min-width:600px){.grid{gap:14px;padding:14px}.item{padding:12px 10px}.nm{font-size:16px}.pr{font-size:17px}.qty button{width:32px;height:32px}.thumb-badge{font-size:60px}}

.note{margin-top:3px;font-size:11px;font-style:italic;font-weight:600;color:var(--gold);letter-spacing:.3px}
.catnote{font-style:normal;font-size:11px;letter-spacing:1.2px;color:#fff0b3;border:1px solid var(--gold2);border-radius:999px;padding:2px 8px;background:rgba(179,18,28,.35);white-space:nowrap}
.namebox{margin-top:14px}
/* Kassenbon */
.receipt{position:relative;margin:4px 6px 22px;padding:16px 16px 14px;background:#f4ecd8;color:#2b2418;border-radius:3px 3px 0 0;font-family:"Courier New",Courier,monospace;font-size:14px;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.55)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(135deg,#f4ecd8 5px,transparent 0) 0 0/14px 10px,linear-gradient(225deg,#f4ecd8 5px,transparent 0) 0 0/14px 10px}
.rh{text-align:center;font-weight:700;font-size:19px;letter-spacing:2px}
.rs{text-align:center;font-size:12px;letter-spacing:3px;margin-top:2px}
.rm{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:#5a4d36}
.dash{border-top:2px dashed #8a7a58;margin:9px 0}
.rl{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.rl span:first-child{overflow-wrap:anywhere}.rl span:last-child{white-space:nowrap}
.rl.empty{justify-content:center;color:#8a7a58}
.rl.rt{font-weight:700;font-size:19px}
.rf{text-align:center;margin-top:10px;font-size:12px;color:#5a4d36}
.btn.again{margin:0 6px 14px;width:calc(100% - 12px)}
.btn.pay{margin-top:10px}
/* Slot-Maschine */
.slotm{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px}
.slot{display:flex;gap:6px;padding:10px;border-radius:14px;background:linear-gradient(180deg,#8c1018,#3a0509);border:2px solid #e0b04a;box-shadow:0 0 0 3px #0a0706,0 0 0 4px var(--gold2),inset 0 0 12px rgba(0,0,0,.7)}
.reel{width:62px;height:72px;display:grid;place-items:center;font-size:38px;line-height:1;color:#000;overflow:hidden;border-radius:8px;background:linear-gradient(180deg,#cfc8b2,#fff 28%,#fff 72%,#cfc8b2);box-shadow:inset 0 6px 8px rgba(0,0,0,.35),inset 0 -6px 8px rgba(0,0,0,.35)}
.spinning .reel:not(.stop){animation:reelblur .12s linear infinite}
.reel.stop{animation:reelpop .35s ease-out}
@keyframes reelblur{0%,100%{transform:translateY(-9px);filter:blur(1.5px)}50%{transform:translateY(9px);filter:blur(1.5px)}}
@keyframes reelpop{0%{transform:translateY(-14px)}60%{transform:translateY(4px)}100%{transform:none}}
.lever{position:relative;width:34px;height:84px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lever::after{content:"";position:absolute;bottom:0;left:50%;width:12px;height:58px;margin-left:-6px;border-radius:6px;background:linear-gradient(90deg,#6b6b6b,#ececec,#6b6b6b);transform-origin:50% 100%}
.lever::before{content:"";position:absolute;top:0;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,#a00d16);box-shadow:0 2px 5px rgba(0,0,0,.7);z-index:1}
.spinning .lever::after{animation:pull .55s ease-in-out}
.spinning .lever::before{animation:ballpull .55s ease-in-out}
@keyframes pull{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.5)}}
@keyframes ballpull{0%,100%{transform:translateY(0)}45%{transform:translateY(30px)}}
.slothint{text-align:center;font-family:var(--disp);font-size:12px;letter-spacing:1px;color:var(--mute);margin:4px 0 6px;min-height:18px}
.slotm.win .slot{animation:winglow .5s ease-in-out infinite alternate}
@keyframes winglow{from{box-shadow:0 0 0 3px #0a0706,0 0 0 4px var(--gold),0 0 10px rgba(255,200,60,.5)}to{box-shadow:0 0 0 3px #0a0706,0 0 0 4px #fff0b3,0 0 28px rgba(255,210,70,1)}}
.btn.spin{background:linear-gradient(180deg,#e8434b,#a30f19 55%,#6e0911);color:#ffe9a0;border:1.5px solid #ffd978;font-family:var(--disp);letter-spacing:1px;text-transform:uppercase;text-shadow:0 1px 0 #000;box-shadow:0 0 14px rgba(220,40,50,.5),0 4px 12px rgba(0,0,0,.5)}
.slotm.lose .slot{box-shadow:0 0 0 3px #0a0706,0 0 0 4px #5b2a2a,inset 0 0 12px rgba(0,0,0,.7);filter:saturate(.7)}
@media (prefers-reduced-motion:reduce){.spinning .reel,.spinning .lever::after,.spinning .lever::before,.slotm.win .slot,.reel.stop{animation:none}}
</style>
</head>
<body>
<main>
<header>
<div class="marquee">
<svg class="crown crown-top" viewBox="0 0 64 44" aria-hidden="true"><path d="M4 10l14 12L32 2l14 20L60 10l-6 28H10z"/><rect x="10" y="40" width="44" height="4" rx="2"/><circle cx="4" cy="10" r="4"/><circle cx="32" cy="3" r="4"/><circle cx="60" cy="10" r="4"/></svg>
<h1 class="gold">Bakery Royale</h1>
<div class="tag">Gute Backwaren. Noch bessere Tage.</div>
</div>
<div class="sides">
<div><span>Jeder Biss<br>ein Gewinn</span><svg class="crown" viewBox="0 0 64 44" aria-hidden="true"><path d="M4 10l14 12L32 2l14 20L60 10l-6 28H10z"/><rect x="10" y="40" width="44" height="4" rx="2"/></svg></div>
<div><span>Snack · Play<br>Enjoy · Repeat</span><svg class="crown" viewBox="0 0 64 44" aria-hidden="true"><path d="M4 10l14 12L32 2l14 20L60 10l-6 28H10z"/><rect x="10" y="40" width="44" height="4" rx="2"/></svg></div>
</div>
<p class="sub">Name eintragen, Mengen wählen, dann per WhatsApp abschicken.</p>
</header>

<nav class="chips" id="chips" aria-label="Kategorien"></nav>

<div id="form"></div>

</main>

<script>
const PHONE = "4917656998961";
const PFAND = 25;

/* ============================================================
   PRODUKTLISTE – hier kannst du alles anpassen (eine Zeile = ein Produkt)
   id    = interne Kennung (nicht ändern)
   cat   = Kategorie
   n     = Name
   p     = Preis in Cent (85 = 0,85 €)
   d     = Pfand: 1 = ja, 0 = nein
   note  = Zusatztext für dieses Produkt, z. B. "nur Zero" oder "solange der Vorrat reicht".
           Steht nur auf der Karte, nicht in der WhatsApp-Nachricht. Leer lassen ("") = nichts.
   ============================================================ */
/* Zusatztext in der Überschrift einer Kategorie (leer / nicht eintragen = nichts) */
const CAT_NOTES = { "Getränke": "nur Zero" };

const ITEMS = [
{ id: "franzbroetchen", cat: "Backwaren", n: "Franzbrötchen", p: 85, d: 0, emoji: "🥐", note: "" },
{ id: "apfeltasche", cat: "Backwaren", n: "Apfeltasche", p: 85, d: 0, emoji: "🥧", note: "" },
{ id: "broetchen", cat: "Backwaren", n: "Brötchen", p: 25, d: 0, emoji: "🥖", note: "" },
{ id: "schoko-croissant", cat: "Backwaren", n: "Schoko-Croissant", p: 80, d: 0, emoji: "🍫", note: "" },
{ id: "butter-croissant", cat: "Backwaren", n: "Butter-Croissant", p: 60, d: 0, emoji: "🥐", note: "" },
{ id: "simit", cat: "Backwaren", n: "Simit", p: 75, d: 0, emoji: "🥯", note: "" },
{ id: "fladenbrot", cat: "Backwaren", n: "Fladenbrot", p: 95, d: 0, emoji: "🫓", note: "" },
{ id: "keks", cat: "Backwaren", n: "Keks", p: 70, d: 0, emoji: "🍪", note: "" },
{ id: "wienerle", cat: "Backwaren", n: "Wienerle", p: 110, d: 0, emoji: "🌭", note: "" },

{ id: "mozzarella", cat: "Snacks & Herzhaftes", n: "Mozzarella", p: 95, d: 0, emoji: "🧀", note: "" },
{ id: "tomatenmark", cat: "Snacks & Herzhaftes", n: "Tomatenmark", p: 95, d: 0, emoji: "🍅", note: "" },

{ id: "gross", cat: "Getränke", n: "Affenpisse groß (0,5 l)", p: 75, d: 1, emoji: "🥤", note: "" },
{ id: "mitte", cat: "Getränke", n: "Affenpisse mitte (0,33 l)", p: 50, d: 1, emoji: "🥤", note: "" },
{ id: "klein", cat: "Getränke", n: "Affenpisse klein (0,25 l)", p: 40, d: 1, emoji: "🥤", note: "" },
{ id: "druckbetankung", cat: "Getränke", n: "Druckbetankung Affenpisse groß (0,5 l) x Rachmaniov", p: 250, d: 1, emoji: "🍾", note: "" }
];

const $ = s => document.querySelector(s);
const eur = c => (c / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const NAME_KEY = "bakeryroyale-name";
function loadName() { try { return localStorage.getItem(NAME_KEY) || ""; } catch (e) { return ""; } }
function saveName(v) { try { localStorage.setItem(NAME_KEY, v); } catch (e) {} }
const LAST_KEY = "bakeryroyale-last";
function loadLast() { try { return JSON.parse(localStorage.getItem(LAST_KEY) || "{}"); } catch (e) { return {}; } }
function saveLast(q) { try { localStorage.setItem(LAST_KEY, JSON.stringify(q)); } catch (e) {} }
const newNo = () => String(1000 + Math.floor(Math.random() * 9000));
let draft = { name: loadName(), q: {}, fav: {}, note: "", no: newNo() }, status = { t: "", c: "" };

function sums() {
let ware = 0, pfand = 0;
ITEMS.forEach(i => {
const q = draft.q[i.id] || 0;
ware += q * i.p;
if (i.d) pfand += q * PFAND;
});
return { ware, pfand, total: ware + pfand };
}

function orderText() {
const s = sums();
const lines = ITEMS.filter(i => (draft.q[i.id] || 0) > 0).map(i => "🃏 " + draft.q[i.id] + "× " + i.n);
return "🎰 BAKERY ROYALE 🎰\n"
+ "🧾 Bon-Nr. " + draft.no + "\n"
+ "👑 Spieler: " + (draft.name.trim() || "Ohne Name") + "\n\n"
+ "🎲 Einsatz:\n" + lines.join("\n") + "\n\n"
+ "💰 Gesamteinsatz: " + eur(s.total) + " (inkl. Pfand)\n"
+ (draft.note.trim() ? "📝 Anmerkung: " + draft.note.trim() + "\n" : "")
+ ((draft.q["druckbetankung"] || 0) > 0 ? "🎰 Jackpot bester Einkauf!" : "");
}

const CROWN = '<svg viewBox="0 0 64 44" aria-hidden="true" fill="currentColor"><path d="M4 10l14 12L32 2l14 20L60 10l-6 28H10z"/><rect x="10" y="40" width="44" height="4" rx="2"/></svg>';
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.6 1.1 5.4 3.1 1.8-2 3.4-3.1 5.4-3.1 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z" stroke-linejoin="round"/></svg>';
const slug = c => "c-" + c.toLowerCase().replace(/[^a-z]+/g, "-").replace(/-$/, "");

let spinning = false;
function spin() {
spinning = true;
const SYM = ["🥐", "🍪", "🍒", "7️⃣", "🥨", "👑", "🍀"];
const reelsEl = () => [...document.querySelectorAll(".reel")];
const slotEl = () => $(".slotm");
const hint = t => { const h = $("#slothint"); if (h) h.textContent = t; };
// Immer verloren: Beinahe-Treffer mit zwei Kronen, dritte Walze anders
const others = SYM.filter(x => x !== "👑");
const result = ["👑", "👑", others[Math.floor(Math.random() * others.length)]];
const m = slotEl();
m.classList.remove("win", "lose");
m.classList.add("spinning");
reelsEl().forEach(r => r.classList.remove("stop"));
hint("🎰 Walzen drehen …");
const timers = [0, 1, 2].map(n => setInterval(() => {
const r = reelsEl()[n]; if (r) r.textContent = SYM[Math.floor(Math.random() * SYM.length)];
}, 70));
[0, 1, 2].forEach(n => setTimeout(() => {
clearInterval(timers[n]);
const r = reelsEl()[n]; if (r) { r.textContent = result[n]; r.classList.add("stop"); }
}, 800 + n * 600));
setTimeout(() => {
spinning = false;
const mm = slotEl(); if (mm) { mm.classList.remove("spinning"); mm.classList.add("lose"); }
hint("😢 Knapp daneben – nochmal ziehen!");
}, 800 + 2 * 600 + 400);
}

function fallbackToEmoji(imgEl) {
const div = document.createElement("div");
div.className = "thumb-badge";
div.setAttribute("aria-hidden", "true");
div.textContent = imgEl.dataset.emoji || "🛒";
imgEl.replaceWith(div);
}

function render() {
const s = sums();
let h = "";

let lastCat = "";
ITEMS.forEach(i => {
if (i.cat !== lastCat) {
if (lastCat) h += '</div>';
h += '<div class="cat" id="' + slug(i.cat) + '">' + CROWN + '<span class="gold">' + esc(i.cat) + '</span>' + (CAT_NOTES[i.cat] ? '<em class="catnote">' + esc(CAT_NOTES[i.cat]) + '</em>' : '') + CROWN + '</div><div class="grid">';
lastCat = i.cat;
}
const src = IMG[i.id];
const img = src
? '<img class="thumb" src="' + src + '" alt="' + esc(i.n) + '" data-emoji="' + esc(i.emoji) + '" onerror="fallbackToEmoji(this)">'
: '<div class="thumb-badge" aria-hidden="true">' + esc(i.emoji) + '</div>';
const jp = i.id === "druckbetankung";
const fav = !!draft.fav[i.id];

h += '<div class="item' + (jp ? ' jackpot' : '') + '">'
+ (jp ? '<div class="jp">' + CROWN + '<span>JACKPOT</span></div>' : '')
+ '<button type="button" class="fav' + (fav ? ' on' : '') + '" data-f="' + esc(i.id) + '" aria-label="Favorit" aria-pressed="' + fav + '">' + HEART + '</button>'
+ '<div class="media">' + img + '</div>'
+ '<div class="nm">' + esc(i.n) + '</div>'
+ (i.note ? '<div class="note">' + esc(i.note) + '</div>' : '')
+ '<div class="pr">' + eur(i.p) + (i.d ? '<small>+ 0,25 € Pfand</small>' : '') + '</div>'
+ '<div class="qty">'
+ '<button type="button" data-m="' + esc(i.id) + '" aria-label="weniger">−</button>'
+ '<b>' + (draft.q[i.id] || 0) + '</b>'
+ '<button type="button" data-p="' + esc(i.id) + '" aria-label="mehr">+</button>'
+ '</div></div>';
});
h += '</div>';

const last = Object.entries(loadLast()).filter(([id, n]) => n > 0 && ITEMS.some(x => x.id === id));
const payUrl = s.total > 0 ? "https://paypal.me/LHrauda/" + (s.total / 100).toFixed(2) + "EUR" : "#";
const rows = ITEMS.filter(i => (draft.q[i.id] || 0) > 0).map(i =>
'<div class="rl"><span>' + draft.q[i.id] + '× ' + esc(i.n) + '</span><span>' + eur(i.p * draft.q[i.id]) + '</span></div>').join("")
|| '<div class="rl empty">– noch nichts gewählt –</div>';
const stamp = new Date().toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });

h += '<div class="card" style="margin-top:20px">'
+ (last.length ? '<button type="button" class="btn alt again" id="again">🔁 Wie letztes Mal</button>' : '')
+ '<div class="receipt">'
+ '<div class="rh">BAKERY ROYALE</div><div class="rs">★ KASSENBON ★</div>'
+ '<div class="rm"><span>' + esc(stamp) + '</span><span>Bon-Nr. ' + draft.no + '</span></div>'
+ '<div class="dash"></div>' + rows + '<div class="dash"></div>'
+ '<div class="rl"><span>Ware</span><span>' + eur(s.ware) + '</span></div>'
+ '<div class="rl"><span>Pfand</span><span>' + eur(s.pfand) + '</span></div>'
+ '<div class="dash"></div>'
+ '<div class="rl rt"><span>SUMME</span><span>' + eur(s.total) + '</span></div>'
+ '<div class="rf">Danke für deinen Einsatz!</div>'
+ '</div>'
+ '<div class="namebox"><label class="name-label" for="nm">Dein Name</label>'
+ '<input type="text" id="nm" placeholder="z. B. Max" value="' + esc(draft.name) + '"></div>'
+ '<div class="namebox"><label class="name-label" for="note">Anmerkung (optional)</label>'
+ '<textarea id="note" rows="2" maxlength="200" placeholder="z. B. Brötchen bitte ungeschnitten">' + esc(draft.note) + '</textarea></div>'
+ '<button type="button" class="btn alt" id="reset">🔄 Neue Runde</button>'
+ '<div class="slotm' + (spinning ? ' spinning' : '') + '"><div class="slot"><div class="reel">🥐</div><div class="reel">👑</div><div class="reel">🥐</div></div><button type="button" class="lever" id="lever" aria-label="Hebel ziehen"></button></div>'
+ '<div class="slothint" id="slothint">👆 Zieh am Hebel!</div>'
+ '<a class="btn spin" id="wa" href="#" rel="noopener">💬 Per WhatsApp bestellen</a>'
+ '<a class="btn alt pay" id="payb" href="' + payUrl + '"' + (s.total > 0 ? ' target="_blank" rel="noopener"' : '') + '>💳 Jetzt bezahlen' + (s.total > 0 ? ' (' + eur(s.total) + ')' : '') + '</a>'
+ '<p class="msg ' + status.c + '">' + esc(status.t) + '</p></div>';
$("#form").innerHTML = h;
}

function check() {
if (!draft.name.trim()) {
status = { t: "Bitte zuerst deinen Namen eintragen.", c: "err" };
render();
return false;
}
if (sums().total === 0) {
status = { t: "Wähle zuerst mindestens einen Artikel.", c: "err" };
render();
return false;
}
return true;
}

async function copyFallback(text) {
if (navigator.clipboard && window.isSecureContext) {
await navigator.clipboard.writeText(text);
return true;
}
const ta = document.createElement("textarea");
ta.value = text;
ta.style.position = "fixed";
ta.style.opacity = "0";
document.body.appendChild(ta);
ta.select();
const ok = document.execCommand("copy");
ta.remove();
if (!ok) throw new Error("Copy failed");
return true;
}

document.addEventListener("click", async e => {
const pb = e.target.closest("#payb");
if (pb) {
if (sums().total === 0) {
e.preventDefault();
status = { t: "Wähle zuerst mindestens einen Artikel.", c: "err" };
render();
}
return;
}
const w = e.target.closest("#wa");
if (w) {
e.preventDefault();
if (!check()) return;
const base = PHONE ? "https://wa.me/" + PHONE : "https://wa.me/";
const url = base + "?text=" + encodeURIComponent(orderText());
saveLast(draft.q);
const win = window.open(url, "_blank");
if (win) { try { win.opener = null; } catch (err) {} } else { location.href = url; }
return;
}
const chip = e.target.closest(".chip");
if (chip) {
document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
return;
}
const lv = e.target.closest("#lever");
if (lv) {
if (!spinning) spin();
return;
}
const b = e.target.closest("button");
if (!b) return;

if (b.dataset.f) {
draft.fav[b.dataset.f] = !draft.fav[b.dataset.f];
render();
return;
}

if (b.dataset.p || b.dataset.m) {
const id = b.dataset.p || b.dataset.m;
draft.q[id] = Math.max(0, (draft.q[id] || 0) + (b.dataset.p ? 1 : -1));
status = { t: "", c: "" };
render();
} else if (b.id === "again") {
const last = loadLast();
draft.q = {};
ITEMS.forEach(i => { if (last[i.id] > 0) draft.q[i.id] = last[i.id]; });
status = { t: "Letzte Bestellung geladen.", c: "ok" };
render();
} else if (b.id === "reset") {
draft.q = {};
draft.note = "";
draft.no = newNo();
status = { t: "Alles auf null – neue Runde, neues Glück!", c: "ok" };
render();
}
});

document.addEventListener("input", e => {
if (e.target.id === "nm") { draft.name = e.target.value; saveName(draft.name); }
if (e.target.id === "note") draft.note = e.target.value;
});
